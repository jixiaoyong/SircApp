<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <!--
    Remove this line, because it needs you input base href in flutter build
    if you forget to do this, and your web app isn't in the root of your web server,
    then you will get error.So, we just remove this line.
    -->
  <!--  <base href="/">-->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sirc App">

  <!-- iOS & Mobile meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sirc App">
  <link rel="apple-touch-icon" href="icons/ic_launcher.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sirc App</title>
  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #475569;
      --accent-color: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --spinner-track: #e2e8f0;
      --spinner-head: #3b82f6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-color: #94a3b8;
        --accent-color: #60a5fa;
        --accent-glow: rgba(96, 165, 250, 0.2);
        --spinner-track: #334155;
        --spinner-head: #60a5fa;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      z-index: 999999;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .loading-container.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .logo-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 22px;
      background-color: var(--accent-glow);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .splash-logo {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 20px;
      object-fit: contain;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      animation: breathe 2.5s ease-in-out infinite alternate;
      z-index: 1;
    }

    .spinner-wrapper {
      margin-top: 28px;
      position: relative;
      width: 32px;
      height: 32px;
    }

    .spinner {
      box-sizing: border-box;
      width: 32px;
      height: 32px;
      border: 3px solid var(--spinner-track);
      border-top-color: var(--spinner-head);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--text-color);
      opacity: 0.85;
      animation: text-fade 1.8s ease-in-out infinite alternate;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.2;
      }
      100% {
        transform: scale(0.95);
        opacity: 0.7;
      }
    }

    @keyframes breathe {
      0% {
        transform: scale(0.98);
      }
      100% {
        transform: scale(1.02);
      }
    }

    @keyframes text-fade {
      0% {
        opacity: 0.45;
      }
      100% {
        opacity: 0.9;
      }
    }
  </style>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="loading" class="loading-container" aria-label="Loading application">
    <div class="splash-content">
      <div class="logo-wrapper">
        <div class="pulse-ring"></div>
        <img class="splash-logo" src="icons/ic_launcher.png" alt="App Logo" onerror="if(this.src.indexOf('assets/ic_launcher.png')===-1){this.src='assets/ic_launcher.png';}else{this.style.display='none';}">
      </div>
      <div class="spinner-wrapper">
        <div class="spinner"></div>
      </div>
      <div class="loading-text">Sirc App</div>
    </div>
  </div>

  <script>
    (function () {
      var loading = document.getElementById('loading');
      var isHidden = false;

      function hideLoading() {
        if (isHidden) return;
        isHidden = true;
        if (loading && !loading.classList.contains('fade-out')) {
          loading.classList.add('fade-out');
          setTimeout(function () {
            if (loading && loading.parentNode) {
              loading.parentNode.removeChild(loading);
            }
          }, 400);
        }
      }

      // 强制兜底计时器：3.5 秒内无论发生任何异常均平滑移除闪屏层，杜绝页面卡死
      var failSafeTimer = setTimeout(function () {
        hideLoading();
      }, 3500);

      function initFlutterApp() {
        if (!window._flutter || !window._flutter.loader) {
          return false;
        }

        var loader = window._flutter.loader;
        var onLoaded = function (engineInitializer) {
          return engineInitializer.initializeEngine().then(function (appRunner) {
            return appRunner.runApp();
          }).then(function () {
            clearTimeout(failSafeTimer);
            hideLoading();
          }).catch(function (error) {
            console.error('Failed to initialize Flutter engine:', error);
            clearTimeout(failSafeTimer);
            hideLoading();
          });
        };

        // 使用兼容稳健的 loadEntrypoint API，避免 _flutter.buildConfig 缺失报错
        var loadConfig = {
          serviceWorker: {
            serviceWorkerVersion: "3172463543" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */,
          },
          onEntrypointLoaded: onLoaded
        };
        loader.loadEntrypoint(loadConfig);
        return true;
      }

      // 解决 load 事件与异步 defer 脚本的时序竞态问题
      var attempts = 0;
      function startApp() {
        if (initFlutterApp()) return;
        if (++attempts < 60) {
          setTimeout(startApp, 50);
        } else {
          hideLoading();
        }
      }

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        startApp();
      } else {
        window.addEventListener('load', startApp);
      }
    })();
  </script>
</body>
</html>
