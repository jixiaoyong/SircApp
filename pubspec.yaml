name: sirc
description: Finance Mobile Banking App

# 限制包发布到 pub.dev（纯私有应用）
publish_to: 'none'

# 应用版本号配置
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  # ==========================================
  # 1. 核心框架与国际化
  # ==========================================
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ==========================================
  # 2. 状态管理 (Riverpod 3.x 现代架构)
  # ==========================================
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # ==========================================
  # 3. 声明式路由导航
  # ==========================================
  go_router: ^14.8.1

  # ==========================================
  # 4. 网络通信、加密与持久化
  # ==========================================
  http: ^1.2.2
  crypto: ^3.0.5
  shared_preferences: ^2.3.2

  # ==========================================
  # 5. UI 适配与界面视图组件
  # ==========================================
  flutter_screenutil_plus:
    hosted: https://pub.dev
    version: 2.0.0
  extended_image: ^8.2.0
  month_picker_dialog: ^6.7.3
  webview_flutter: ^4.8.0
  # 自适应高度内嵌 WebView 组件（基于现代 ResizeObserver 标准）
  embed_webview:
    hosted: https://pub.dev
    version: ^0.2.0

  # ==========================================
  # 6. 系统交互与原生支持
  # ==========================================
  path_provider: ^2.1.6
  url_launcher: ^6.3.0
  logger: ^2.4.0
  flutter_native_splash: ^2.4.1
  flutter_svg: ^2.3.2

dev_dependencies:
  # ==========================================
  # 1. 测试套件
  # ==========================================
  flutter_test:
    sdk: flutter

  # ==========================================
  # 2. 自动化代码生成工具链
  # ==========================================
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.0+1

  # ==========================================
  # 3. 静态代码分析与代码规范
  # ==========================================
  flutter_lints: ^4.0.0
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1

flutter:
  # 启用 Material Design 图标与组件规范
  uses-material-design: true

  # 静态静态资源配置
  assets:
    - assets/
    - assets/imgs/
